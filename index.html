<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ぽいんと帳</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">POINT LEDGER</p>
      <h1 class="app-title"><img src="point-title-brush-cropped.png" alt="ぽいんと帳" /></h1>
    </div>
    <button id="addPointBtn" class="primary">＋ ポイントを追加</button>
  </header>

  <main>
    <section class="summary-grid" aria-label="サマリー">
      <article class="summary-card">
        <span>登録サービス</span><strong id="serviceCount">0</strong><small>種類</small>
      </article>
      <article class="summary-card">
        <span>合計ポイント</span><strong id="totalPoints">0</strong><small>pt</small>
      </article>
      <article class="summary-card warning">
        <span>30日以内に失効</span><strong id="expiringSoon">0</strong><small>件</small>
      </article>
    </section>

    <section class="section-head">
      <div><p class="eyebrow">DASHBOARD</p><h2>ポイント一覧</h2></div>
      <p class="hint">残高欄へ直接入力すると自動保存されます</p>
    </section>

    <section id="pointGrid" class="point-grid"></section>
    <section id="emptyState" class="empty-state hidden">
      <div class="empty-icon">P</div>
      <h2>ポイントを登録しましょう</h2>
      <p>最初のポイントサービスを追加すると、残高や有効期限をまとめて確認できます。</p>
      <button class="primary" id="emptyAddBtn">ポイントを追加</button>
    </section>
  </main>

  <dialog id="pointDialog">
    <form id="pointForm" method="dialog">
      <div class="dialog-head"><h2 id="pointDialogTitle">ポイントを追加</h2><button type="button" class="icon-btn close">×</button></div>
      <input type="hidden" id="pointId" />
      <label>サービス名<input id="pointName" required maxlength="30" placeholder="例：楽天ポイント" /></label>
      <label>テーマ色<input id="pointColor" type="color" value="#5b66e8" /></label>
      <div class="dialog-actions"><button type="button" id="deletePointBtn" class="danger hidden">このポイントを削除</button><div class="dialog-actions-right"><button type="button" class="secondary close">キャンセル</button><button class="primary" value="default">保存</button></div></div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="dialog-head"><div><p class="eyebrow">DETAIL</p><h2 id="detailTitle"></h2></div><button type="button" class="icon-btn detail-close">×</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="history">獲得履歴</button>
      <button class="tab" data-tab="expiry">有効期限</button>
    </div>
    <section id="historyTab" class="tab-panel active">
      <form id="historyForm" class="inline-form">
        <input id="historyDate" type="date" required />
        <input id="historyAmount" type="number" step="1" required placeholder="獲得・使用ポイント" />
        <input id="historyMemo" maxlength="40" placeholder="内容（任意）" />
        <button class="primary">追加</button>
      </form>
      <p class="form-note">獲得はプラス、使用はマイナスで入力してください。</p>
      <div id="historyList" class="list"></div>
    </section>
    <section id="expiryTab" class="tab-panel">
      <form id="expiryForm" class="inline-form">
        <input id="expiryDate" type="date" required />
        <input id="expiryAmount" type="number" min="1" step="1" required placeholder="失効予定ポイント" />
        <input id="expiryMemo" maxlength="40" placeholder="メモ（任意）" />
        <button class="primary">追加</button>
      </form>
      <div id="expiryList" class="list"></div>
    </section>
  </dialog>

  <template id="pointCardTemplate">
    <article class="point-card">
      <div class="card-accent"></div>
      <div class="card-top">
        <div class="brand-mark"></div>
        <div class="card-title-wrap"><h3></h3><p class="change"></p></div>
        <button class="menu-btn" aria-label="編集">•••</button>
      </div>
      <label class="balance-label">現在のポイント
        <div class="balance-row"><input class="balance-input" type="number" min="0" step="1" /><span>pt</span></div>
      </label>
      <div class="card-footer"><span class="expiry-summary"></span><button class="detail-btn">詳細を見る →</button></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
